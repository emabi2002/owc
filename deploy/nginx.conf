# ============================================================================
# OWC PNG — Nginx reverse proxy (Ubuntu Server 24.04 LTS)
# Place at /etc/nginx/sites-available/owc and symlink into sites-enabled.
# TLS certificates via: sudo certbot --nginx -d owc.gov.pg -d www.owc.gov.pg
# ============================================================================

# Rate-limiting zones (defence in depth; app also rate-limits).
limit_req_zone $binary_remote_addr zone=owc_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=owc_login:10m   rate=1r/s;

upstream owc_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name owc.gov.pg www.owc.gov.pg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name owc.gov.pg www.owc.gov.pg;

    # --- TLS (managed by Certbot) ------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/owc.gov.pg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/owc.gov.pg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers (production hardening) ----------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Next.js currently requires inline styles/scripts in this deployment.
    # Production excludes JavaScript evaluation semantics. A future nonce/hash-
    # based CSP may remove unsafe-inline after end-to-end compatibility testing.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Next.js static assets (immutable, long cache) ---------------------
    location /_next/static/ {
        proxy_pass http://owc_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Login / admin auth endpoints (strict rate limit) ------------------
    location /api/admin/login {
        limit_req zone=owc_login burst=5 nodelay;
        proxy_pass http://owc_app;
        include /etc/nginx/proxy_params;
    }

    # --- Everything else ----------------------------------------------------
    location / {
        limit_req zone=owc_general burst=40 nodelay;
        proxy_pass http://owc_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
