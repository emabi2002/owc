# Netlify deployment for the dynamic Next.js app.
# Set NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
# SUPABASE_SECRET_KEY and OWC_PERSISTENT_DEMONSTRATION in Netlify environment
# and any CPPS_* / CAPTCHA_* variables in Site settings → Environment variables.
[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Pull-request deploy previews are the controlled evaluation environment. This
# enables the internal service adapters used by the operational presentation
# routes while keeping production deployments disabled by default unless an
# administrator explicitly configures the equivalent production endpoints.
[context.deploy-preview.environment]
  OWC_ENABLE_SANDBOX = "true"
  OWC_PERSISTENT_DEMONSTRATION = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
