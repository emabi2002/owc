name: Demo deploy RED contract

on:
  push:
    branches: [fix/demo-deploy-unconfigured-skip-red]

jobs:
  red-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run deployment readiness contract
        run: bun test src/lib/operations/demo-deploy-readiness.test.ts
