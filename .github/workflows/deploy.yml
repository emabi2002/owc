name: CI / Deploy

on:
  push:
    branches: [main, feature/drupal-enterprise-cms, feature/drupal-content-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test · Lint · Type-check · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Lint & type-check
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          # Public build-time vars (safe). Configure as repo/environment secrets.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CAPTCHA_PROVIDER: ${{ secrets.NEXT_PUBLIC_CAPTCHA_PROVIDER }}
          NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}

  drupal-clean-room:
    name: Drupal clean-room reconstruction
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate Drupal bootstrap shell
        run: bash -n drupal/scripts/bootstrap.sh

      - name: Build isolated Drupal stack
        working-directory: drupal
        run: docker compose -p owc-drupal-ci up -d --build

      - name: Reconstruct CMS from committed configuration
        working-directory: drupal
        run: docker compose -p owc-drupal-ci exec -T drupal /opt/owc-drupal/scripts/bootstrap.sh

      - name: Verify reconstructed CMS
        working-directory: drupal
        run: |
          docker compose -p owc-drupal-ci exec -T drupal /opt/owc-drupal/scripts/verify.sh
          docker compose -p owc-drupal-ci exec -T drupal vendor/bin/drush config:status
          docker compose -p owc-drupal-ci exec -T drupal vendor/bin/drush config:get system.site uuid
          docker compose -p owc-drupal-ci exec -T drupal vendor/bin/drush config:get workflows.workflow.owc_editorial label

      - name: Verify bootstrap is idempotent
        working-directory: drupal
        run: docker compose -p owc-drupal-ci exec -T drupal /opt/owc-drupal/scripts/bootstrap.sh

      - name: Show Drupal logs on failure
        if: failure()
        working-directory: drupal
        run: docker compose -p owc-drupal-ci logs --no-color drupal postgres

      - name: Remove isolated Drupal stack
        if: always()
        working-directory: drupal
        run: docker compose -p owc-drupal-ci down -v

  deploy:
    name: Deploy to Ubuntu (SSH)
    needs: [build, drupal-clean-room]
    runs-on: ubuntu-latest
    # Only deploy on direct pushes to main, and only when SSH secrets are set.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH (git pull + build + PM2 reload)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            bun install --frozen-lockfile
            bun run build
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save
