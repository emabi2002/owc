name: CI / Deploy

on:
  push:
    branches: [main, feature/drupal-enterprise-cms, feature/drupal-content-migration, feature/drupal-editor-identity, feature/claims-evidence-production-readiness, feature/production-integration-hub, feature/production-infrastructure-readiness, feature/reference-cpps-ecosystem, feature/backup-disaster-recovery-readiness, feature/operational-administration-sla, feature/security-assessment-readiness, feature/end-to-end-uat-readiness, feature/final-cutover-readiness, fix/demo-deploy-unconfigured-skip]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test · Lint · Type-check · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate deployment and assurance shell
        run: |
          bash -n deploy/release.sh
          bash -n deploy/monitor-check.sh
          for script in deploy/backup/*.sh; do
            bash -n "$script"
          done
          bash -n scripts/security/repository-assurance.sh
      - name: Run repository security assurance
        run: bash scripts/security/repository-assurance.sh
      - name: Run tests
        run: bun test
      - name: Run reference end-to-end UAT
        run: bun run uat:reference
        env:
          OWC_UAT_EVIDENCE_PATH: artifacts/reference-uat-evidence.json
      - name: Upload reference UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-uat-evidence
          path: artifacts/reference-uat-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Run presentation-level demonstration UAT
        run: bun run uat:demonstration
        env:
          OWC_DEMONSTRATION_UAT_EVIDENCE_PATH: artifacts/demonstration-uat-evidence.json
      - name: Upload demonstration UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demonstration-uat-evidence
          path: artifacts/demonstration-uat-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Verify demonstration terminology
        run: bun run demo:terminology
      - name: Run OWC demonstration release rehearsal
        run: bun run demo:release
        env:
          OWC_DEMONSTRATION_RELEASE_EVIDENCE_PATH: artifacts/demonstration-release.json
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Upload OWC demonstration release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demonstration-release
          path: artifacts/demonstration-release.json
          if-no-files-found: error
          retention-days: 30
      - name: Lint & type-check
        run: bun run lint
      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_CAPTCHA_PROVIDER: ${{ secrets.NEXT_PUBLIC_CAPTCHA_PROVIDER }}
          NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}

  drupal-clean-room:
    name: Drupal clean-room reconstruction
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install exporter dependencies
        run: bun install --frozen-lockfile
      - name: Export canonical reference content
        run: bun run drupal:export-content
      - name: Validate Drupal migration shell scripts
        run: |
          bash -n drupal/scripts/bootstrap.sh
          bash -n drupal/scripts/import-content.sh
          bash -n drupal/scripts/verify-content-parity.sh
          bash -n drupal/scripts/configure-identity.sh
          bash -n drupal/scripts/verify-identity.sh
      - name: Build isolated Drupal stack
        working-directory: drupal
        run: docker compose -p owc-drupal-ci up -d --build
      - name: Reconstruct CMS from committed configuration
        working-directory: drupal
        run: docker compose -p owc-drupal-ci exec -T drupal /opt/owc-drupal/scripts/bootstrap.sh
      - name: Import canonical OWC content
        working-directory: drupal
        run: docker compose -p owc-drupal-ci exec -T drupal /opt/owc-drupal/scripts/import-content.sh
      - name: Verify migration is idempotent
        working-directory: drupal
        run: |
          SECOND_IMPORT="$(docker compose -p owc-drupal-ci exec -T drupal /opt/owc-drupal/scripts/import-content.sh)"
          echo "$SECOND_IMPORT"
          if echo "$SECOND_IMPORT" | grep -Eq '"created": [1-9]'; then
            echo "Second import created duplicate content" >&2
            exit 1
          fi
      - name: Verify source-to-Drupal content parity
        working-directory: drupal
        run: docker compose -p owc-drupal-ci exec -T drupal /opt/owc-drupal/scripts/verify-content-parity.sh
      - name: Configure CI OIDC client
        working-directory: drupal
        run: |
          docker compose -p owc-drupal-ci exec -T \
            -e OWC_OIDC_CLIENT_ID=ci-client \
            -e OWC_OIDC_CLIENT_SECRET=ci-secret-not-production \
            -e OWC_OIDC_AUTHORIZATION_ENDPOINT=https://identity.invalid/authorize \
            -e OWC_OIDC_TOKEN_ENDPOINT=https://identity.invalid/token \
            -e OWC_OIDC_USERINFO_ENDPOINT=https://identity.invalid/userinfo \
            drupal /opt/owc-drupal/scripts/configure-identity.sh
          docker compose -p owc-drupal-ci exec -T \
            -e OWC_OIDC_CLIENT_ID=ci-client \
            -e OWC_OIDC_CLIENT_SECRET=ci-secret-not-production \
            -e OWC_OIDC_AUTHORIZATION_ENDPOINT=https://identity.invalid/authorize \
            -e OWC_OIDC_TOKEN_ENDPOINT=https://identity.invalid/token \
            -e OWC_OIDC_USERINFO_ENDPOINT=https://identity.invalid/userinfo \
            drupal /opt/owc-drupal/scripts/verify-identity.sh
          docker compose -p owc-drupal-ci exec -T drupal vendor/bin/drush config:delete openid_connect.client.owc_corporate -y
      - name: Verify Drupal editor identity readiness
        working-directory: drupal
        run: |
          docker compose -p owc-drupal-ci exec -T drupal /opt/owc-drupal/scripts/verify-identity.sh
          if docker compose -p owc-drupal-ci exec -T -e OWC_IDENTITY_ENFORCE_SSO=1 drupal /opt/owc-drupal/scripts/verify-identity.sh; then
            echo "Identity readiness unexpectedly accepted SSO enforcement without a configured client" >&2
            exit 1
          fi
          docker compose -p owc-drupal-ci exec -T drupal vendor/bin/drush pm:list --status=enabled --type=module --format=list | grep -Fx externalauth
          docker compose -p owc-drupal-ci exec -T drupal vendor/bin/drush pm:list --status=enabled --type=module --format=list | grep -Fx openid_connect
          docker compose -p owc-drupal-ci exec -T drupal vendor/bin/drush pm:list --status=enabled --type=module --format=list | grep -Fx owc_identity
      - name: Verify reconstructed CMS
        working-directory: drupal
        run: |
          docker compose -p owc-drupal-ci exec -T drupal /opt/owc-drupal/scripts/verify.sh
          docker compose -p owc-drupal-ci exec -T drupal vendor/bin/drush config:status
          docker compose -p owc-drupal-ci exec -T drupal vendor/bin/drush config:get system.site uuid
          docker compose -p owc-drupal-ci exec -T drupal vendor/bin/drush config:get workflows.workflow.owc_editorial label
      - name: Verify bootstrap is idempotent
        working-directory: drupal
        run: docker compose -p owc-drupal-ci exec -T drupal /opt/owc-drupal/scripts/bootstrap.sh
      - name: Show Drupal logs on failure
        if: failure()
        working-directory: drupal
        run: docker compose -p owc-drupal-ci logs --no-color drupal postgres
      - name: Remove isolated Drupal stack
        if: always()
        working-directory: drupal
        run: docker compose -p owc-drupal-ci down -v

  deploy:
    name: Deploy to Ubuntu (SSH)
    needs: [build, drupal-clean-room]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check demonstration deployment configuration
        id: deploy-config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$DEPLOY_HOST" ]] || missing+=("DEPLOY_HOST")
          [[ -n "$DEPLOY_USER" ]] || missing+=("DEPLOY_USER")
          [[ -n "$DEPLOY_PATH" ]] || missing+=("DEPLOY_PATH")
          [[ -n "$DEPLOY_SSH_KEY" ]] || missing+=("DEPLOY_SSH_KEY")
          if (( ${#missing[@]} > 0 )); then
            printf 'configured=false\n' >> "$GITHUB_OUTPUT"
            printf '::notice::Demonstration deployment not configured; skipping SSH deploy. Missing: %s\n' "$(IFS=,; echo "${missing[*]}")"
          else
            printf 'configured=true\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy over SSH (health-checked release)
        if: steps.deploy-config.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            bash deploy/release.sh
